<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc" lang="vi" data-language="vi-VN" data-alt-text-vi="Cấu trúc 112 bản ghi cơ hội gồm 96 mục có thể xếp hạng và 16 nhóm bao quát hoặc không xếp hạng riêng; chỉ mô tả cấu trúc nghiên cứu, không phải quy mô thị trường."><title id="title">Cấu trúc vũ trụ 112 cơ hội</title><desc id="desc">112 bản ghi cơ hội gồm 96 mục có thể xếp hạng và 16 nhóm bao quát hoặc không xếp hạng riêng. Chỉ mô tả cấu trúc; không hàm ý mức hấp dẫn định lượng.</desc><metadata id="text-equivalent-vi">Cấu trúc 112 bản ghi cơ hội gồm 96 mục có thể xếp hạng và 16 nhóm bao quát hoặc không xếp hạng riêng; chỉ mô tả cấu trúc nghiên cứu, không phải quy mô thị trường.</metadata><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1238D4"/><stop offset="0.58" stop-color="#1378E5"/><stop offset="1" stop-color="#13B7ED"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity="0.10"/></filter></defs><rect width="1440" height="720" rx="32" fill="#FFFFFF"/><text x="90" y="90" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="42" font-weight="800" fill="#071022" text-anchor="start">Vũ trụ cơ hội đã rà soát</text><text x="90" y="130" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">112 bản ghi = 96 có thể xếp hạng + 16 nhóm bao quát / không xếp hạng</text><rect x="110" y="240" width="320" height="190" rx="28" fill="#EDF6FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="140" y="288" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="28" font-weight="700" fill="#071022" text-anchor="start">112</text><text x="140" y="324" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">Tổng bản ghi</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#A7B8D8"/></marker></defs><line x1="430" y1="335" x2="590" y2="335" stroke="#A7B8D8" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"/><rect x="600" y="190" width="300" height="150" rx="28" fill="#F7FBFF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="630" y="238" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="28" font-weight="700" fill="#071022" text-anchor="start">96</text><text x="630" y="274" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">Có thể xếp hạng</text><rect x="600" y="390" width="300" height="150" rx="28" fill="#E9E8FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="630" y="438" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="28" font-weight="700" fill="#071022" text-anchor="start">16</text><text x="630" y="474" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start">Nhóm bao quát / không xếp hạng</text><text x="1010" y="318" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="27" font-weight="700" fill="#1238D4" text-anchor="start">Chỉ mô tả cấu trúc</text><text x="1010" y="360" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="18" font-weight="400" fill="#64748B" text-anchor="start">không phải phân bổ quy mô thị trường</text></svg>