<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc" lang="vi" data-language="vi-VN" data-alt-text-vi="Lộ trình sáu cổng Healthcare: đối tác chuyên môn hoặc lâm sàng, bên mua, cam kết thương mại, mua sắm và CNTT/bảo mật/LMS, lõi tái sử dụng, và kinh tế sau bằng chứng trả phí."><title id="title">Lộ trình 6 cổng kiểm chứng Healthcare</title><desc id="desc">Sáu cổng gồm đối tác chuyên môn hoặc lâm sàng, bên mua, cam kết thương mại, mua sắm và CNTT/bảo mật/LMS, lõi tái sử dụng, rồi kinh tế sau bằng chứng trả phí.</desc><metadata id="text-equivalent-vi">Lộ trình sáu cổng Healthcare: đối tác chuyên môn hoặc lâm sàng, bên mua, cam kết thương mại, mua sắm và CNTT/bảo mật/LMS, lõi tái sử dụng, và kinh tế sau bằng chứng trả phí.</metadata><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1238D4"/><stop offset="0.58" stop-color="#1378E5"/><stop offset="1" stop-color="#13B7ED"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity="0.10"/></filter></defs><rect width="1440" height="720" rx="32" fill="#FFFFFF"/><text x="80" y="70" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="35" font-weight="800" fill="#071022" text-anchor="start">Lộ trình 6 cổng kiểm chứng Healthcare</text><text x="80" y="108" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="18" font-weight="600" fill="#64748B" text-anchor="start">Chỉ tiến bước khi bằng chứng giới hạn được tích lũy</text><rect x="80" y="170" width="380" height="150" rx="28" fill="#EDF6FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="110" y="218" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="28" font-weight="700" fill="#071022" text-anchor="start">Cổng 1</text><text x="110" y="254" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="17" font-weight="400" fil