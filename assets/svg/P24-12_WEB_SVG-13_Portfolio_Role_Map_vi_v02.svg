<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc" lang="vi" data-language="vi-VN" data-alt-text-vi="Bản đồ danh mục theo bốn nhóm: kiểm chứng trước; có điều kiện hoặc đối chứng; giữ lựa chọn hoặc theo dõi; và tạm dừng hoặc tách riêng. Vị trí không biểu thị mức đầu tư hay xác suất."><title id="title">Bản đồ vai trò danh mục</title><desc id="desc">Bản đồ phân loại các ưu tiên kiểm chứng, đối chứng có điều kiện, lựa chọn theo dõi và Music World tạm dừng hoặc tách riêng.</desc><metadata id="text-equivalent-vi">Bản đồ danh mục theo bốn nhóm: kiểm chứng trước; có điều kiện hoặc đối chứng; giữ lựa chọn hoặc theo dõi; và tạm dừng hoặc tách riêng. Vị trí không biểu thị mức đầu tư hay xác suất.</metadata><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1238D4"/><stop offset="0.58" stop-color="#1378E5"/><stop offset="1" stop-color="#13B7ED"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity="0.10"/></filter></defs><rect width="1440" height="720" rx="32" fill="#FFFFFF"/><text x="80" y="70" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="35" font-weight="800" fill="#071022" text-anchor="start">Bản đồ vai trò danh mục</text><text x="80" y="108" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="18" font-weight="600" fill="#64748B" text-anchor="start">Vai trò là nhóm phân loại, không phải quy mô hay mức đầu tư</text><rect x="55" y="160" width="305" height="430" rx="28" fill="#EDF6FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="85" y="208" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="21" font-weight="700" fill="#071022" text-anchor="start">KIỂM CHỨNG TRƯỚC</text><rect x="80" y="260" width="255" height="64" rx="32.0" fill="#FFFFFF" stroke="#D6E5FA" stroke-width="2"/><text x="207.5" y="300.0" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="24" font-weight="700" fill="#071022" text-anchor="middle">Healthcare</text><rect x="80" y="355" width="255" height="64" rx="32.0" fill="#FFFFFF" stroke="#D6E5FA" stroke-width="2"/><text x="207.5" y="395.0" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="24" font-weight="700" fill="#071022" text-anchor="middle">Music</text><rect x="400" y="160" width="305" height="430" rx="28" fill="#EDF6FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="430" y="208" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="18" font-weight="700" fill="#071022" text-anchor="start">CÓ ĐIỀU KIỆN / ĐỐI CHỨNG</text><rect x="425" y="260" width="255" height="64" rx="32.0" fill="#FFFFFF" stroke="#D6E5FA" stroke-width="2"/><text x="552.5" y="300.0" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="24" font-weight="700" fill="#071022" text-anchor="middle">Warehouse</text><rect x="425" y="355" width="255" height="64" rx="32.0" fill="#FFFFFF" stroke="#D6E5FA" stroke-width="2"/><text x="552.5" y="395.0" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="24" font-weight="700" fill="#071022" text-anchor="middle">Puzzle</text><rect x="745" y="160" width="305" height="430" rx="28" fill="#E9E8FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="775" y="208" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="18" font-weight="700" fill="#071022" text-anchor="start">GIỮ LỰA CHỌN / THEO DÕI</text><rect x="770" y="260" width="255" height="64" rx="32.0" fill="#FFFFFF" stroke="#D6E5FA" stroke-width="2"/><text x="897.5" y="300.0" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="24" font-weight="700" fill="#071022" text-anchor="middle">Virtual Commissioning</text><rect x="770" y="355" width="255" height="64" rx="32.0" fill="#FFFFFF" stroke="#D6E5FA" stroke-width="2"/><text x="897.5" y="395.0" font-family="Arial, &quot;Noto Sans&quot;