<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc" lang="vi" data-language="vi-VN" data-alt-text-vi="Hai luồng sàng lọc nghiên cứu: B2B/B2G 65 → 12 → 5 → 3 và B2C 32 → 11 → 5 → 3; số 3 là ba hướng được phân tích sâu nhất. Đây không phải tỷ lệ chuyển đổi thị trường."><title id="title">Phễu sàng lọc nghiên cứu hai luồng</title><desc id="desc">Quá trình sàng lọc nghiên cứu: B2B/B2G 65→12→5→3 và B2C 32→11→5→3; bước cuối là 3 hướng được phân tích sâu nhất; đây là số lượng tuyệt đối, không phải tỷ lệ chuyển đổi thị trường.</desc><metadata id="text-equivalent-vi">Hai luồng sàng lọc nghiên cứu: B2B/B2G 65 → 12 → 5 → 3 và B2C 32 → 11 → 5 → 3; số 3 là ba hướng được phân tích sâu nhất. Đây không phải tỷ lệ chuyển đổi thị trường.</metadata><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1238D4"/><stop offset="0.58" stop-color="#1378E5"/><stop offset="1" stop-color="#13B7ED"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity="0.10"/></filter></defs><rect width="1440" height="720" rx="32" fill="#FFFFFF"/><text x="80" y="78" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="34" font-weight="800" fill="#071022" text-anchor="start">ĐÂY LÀ QUÁ TRÌNH SÀNG LỌC NGHIÊN CỨU</text><text x="80" y="112" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="18" font-weight="700" fill="#1238D4" text-anchor="start">KHÔNG PHẢI TỶ LỆ CHUYỂN ĐỔI THỊ TRƯỜNG</text><text x="80" y="260" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="28" font-weight="800" fill="#071022" text-anchor="start">B2B/B2G</text><rect x="280" y="210" width="190" height="110" rx="28" fill="#EDF6FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="310" y="258" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="28" font-weight="700" fill="#071022" 