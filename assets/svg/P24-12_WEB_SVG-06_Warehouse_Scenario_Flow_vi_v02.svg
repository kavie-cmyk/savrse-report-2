<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc" lang="vi" data-language="vi-VN" data-alt-text-vi="Luồng hỗ trợ quyết định Warehouse từ bài toán vật lý và dữ liệu đại diện qua mô hình bố trí, chạy kịch bản, so sánh điểm nghẽn đến ra quyết định; không tuyên bố có live twin."><title id="title">Luồng kịch bản Warehouse</title><desc id="desc">Một quyết định lập kế hoạch Warehouse đi từ dữ liệu đại diện qua mô hình bố trí và kịch bản đến so sánh phương án và ra quyết định.</desc><metadata id="text-equivalent-vi">Luồng hỗ trợ quyết định Warehouse từ bài toán vật lý và dữ liệu đại diện qua mô hình bố trí, chạy kịch bản, so sánh điểm nghẽn đến ra quyết định; không tuyên bố có live twin.</metadata><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1238D4"/><stop offset="0.58" stop-color="#1378E5"/><stop offset="1" stop-color="#13B7ED"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity="0.10"/></filter></defs><rect width="1440" height="720" rx="32" fill="#FFFFFF"/><text x="80" y="78" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="34" font-weight="800" fill="#071022" text-anchor="start">Quy trình lập kế hoạch / mô phỏng Warehouse</text><text x="80" y="112" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="17" font-weight="600" fill="#64748B" text-anchor="start">Quy trình hỗ trợ quyết định; không tuyên bố có bản sao số vận hành trực tiếp</text><rect x="50" y="260" width="190" height="135" rx="28" fill="#EDF6FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="80" y="308" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="20" font-weight="700" fill="#071022" text-anchor="start">Bài toán vật lý</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#A7B8D8"/></marker></defs><line x1="240" y1="327" x2="265" y2="327" stroke="#A7B8D8" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"/><rect x="275" y="260" width="190" height="135" rx="28" fill="#EDF6FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="305" y="308" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="20" font-weight="700" fill="#071022" text-anchor="start">Dữ liệu đại diện</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#A7B8D8"/></marker></defs><line x1="465" y1="327" x2="490" y2="327" stroke="#A7B8D8" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"/><rect x="500" y="260" width="190" height="135" rx="28" fill="#EDF6FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="530" y="308" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="19" font-weight="700" fill="#071022" text-anchor="start">Mô hình bố trí / luồng</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#A7B8D8"/></marker></defs><line x1="690" y1="327" x2="715" y2="327" stroke="#A7B8D8" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"/><rect x="725" y="260" width="190" height="135" rx="28" fill="#EDF6FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="755" y="308" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="21" font-weight="700" fill="#071022" text-anchor="start">Chạy kịch bản</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#A7B8D8"/></marker></defs><line x1="915" y1="327" x2="940" y2="327" stroke="#A7B8D8" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"/><rect x="950" y="260" width="190" height="135" rx="28" fill="#EDF6FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="980" y="308" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="18" font-weight="700" fill="#071022" text-anchor="start">So sánh điểm nghẽn</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#A7B8D8"/></marker></defs><line x1="1140" y1="327" x2="1165" y2="327" stroke="#A7B8D8" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"/><rect x="1175" y="260" width="190" height="135" rx="28" fill="#EDF6FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="1205" y="308" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="20" font-weight="700" fill="#071022" text-anchor="start">Ra quyết định</text><rect x="450" y="500" width="540" height="70" rx="35.0" fill="#E9E8FF" stroke="#D6E5FA" stroke-width="2"/><text x="720.0" y="543.0" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="18" font-weight="700" fill="#071022" text-anchor="middle">Chỉ tái sử dụng khi lớp mô hình / dữ liệu / kịch bản chuyển giao được</text></svg>