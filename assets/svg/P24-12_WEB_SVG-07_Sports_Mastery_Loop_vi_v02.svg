<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc" lang="vi" data-language="vi-VN" data-alt-text-vi="Vòng thành thạo Sports từ hành động cơ thể, phản hồi tức thời, điều chỉnh kỹ thuật, cải thiện kỹ năng hoặc điểm đến chơi lại; chưa chọn môn thể thao cụ thể."><title id="title">Vòng thành thạo Sports</title><desc id="desc">Vòng thành thạo kỹ năng vận động chung từ hành động, phản hồi, điều chỉnh, cải thiện đến chơi lại; chưa chọn môn thể thao cụ thể.</desc><metadata id="text-equivalent-vi">Vòng thành thạo Sports từ hành động cơ thể, phản hồi tức thời, điều chỉnh kỹ thuật, cải thiện kỹ năng hoặc điểm đến chơi lại; chưa chọn môn thể thao cụ thể.</metadata><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1238D4"/><stop offset="0.58" stop-color="#1378E5"/><stop offset="1" stop-color="#13B7ED"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity="0.10"/></filter></defs><rect width="1440" height="720" rx="32" fill="#FFFFFF"/><text x="80" y="78" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="36" font-weight="800" fill="#071022" text-anchor="start">Vòng thành thạo Sports</text><text x="80" y="112" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="18" font-weight="600" fill="#64748B" text-anchor="start">Mẫu kỹ năng vận động chung — chưa chọn môn thể thao</text><rect x="160" y="260" width="230" height="110" rx="28" fill="#E9E8FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="190" y="308" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="22" font-weight="700" fill="#071022" text-anchor="start">Hành động cơ thể</text><rect x="450" y="150" width="230" height="110" rx="28" fill="#E9E8FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="480" y="198" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="22" font-weight="700" fill="#071022" text-anchor="start">Phản hồi tức thời</text><rect x="800" y="150" width="230" height="110" rx="28" fill="#E9E8FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="830" y="198" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="22" font-weight="700" fill="#071022" text-anchor="start">Điều chỉnh kỹ thuật</text><rect x="1080" y="300" width="230" height="110" rx="28" fill="#E9E8FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="1110" y="348" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="20" font-weight="700" fill="#071022" text-anchor="start">Cải thiện kỹ năng / điểm</text><rect x="600" y="500" width="230" height="110" rx="28" fill="#E9E8FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="630" y="548" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="22" font-weight="700" fill="#071022" text-anchor="start">Chơi lại</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#A7B8D8"/></marker></defs><line x1="275" y1="370" x2="565" y2="150" stroke="#A7B8D8" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#A7B8D8"/></marker></defs><line x1="565" y1="260" x2="915" y2="150" stroke="#A7B8D8" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#A7B8D8"/></marker></defs><line x1="915" y1="260" x2="1195" y2="300" stroke="#A7B8D8" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#A7B8D8"/></marker></defs><line x1="1195" y1="410" x2="715" y2="500" stroke="#A7B8