<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc" lang="vi" data-language="vi-VN" data-alt-text-vi="So sánh hai logic chi tiền: B2B/B2G tách người dùng, người mua kinh tế và mua sắm hợp đồng; B2C tập trung vào hành động, chơi lại, giá và phân phối."><title id="title">Cơ chế chi tiền B2B và B2C</title><desc id="desc">B2B/B2G tách người dùng, người mua và mua sắm; B2C tập trung vào hành động người chơi, chơi lại, giá và phân phối.</desc><metadata id="text-equivalent-vi">So sánh hai logic chi tiền: B2B/B2G tách người dùng, người mua kinh tế và mua sắm hợp đồng; B2C tập trung vào hành động, chơi lại, giá và phân phối.</metadata><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1238D4"/><stop offset="0.58" stop-color="#1378E5"/><stop offset="1" stop-color="#13B7ED"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity="0.10"/></filter></defs><rect width="1440" height="720" rx="32" fill="#FFFFFF"/><text x="80" y="80" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="42" font-weight="800" fill="#071022" text-anchor="start">Hai cơ chế chi tiền khác nhau</text><rect x="90" y="170" width="560" height="430" rx="28" fill="#EDF6FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="120" y="218" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="28" font-weight="700" fill="#071022" text-anchor="start">B2B / B2G</text><text x="120" y="254" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">Tổ chức chi trả để đạt kết quả vận hành</text><rect x="790" y="170" width="560" height="430" rx="28" fill="#E9E8FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="820" y="218" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="28" font-weight="700" fill="#071022" text-anchor="start">B2C</text><text x="820" y="254" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="18" font-weight="400" fill="#64748B" text-anchor="start">Người chơi chi trả cho trải nghiệm</text><rect x="150" y="300" width="430" height="62" rx="31.0" fill="#EDF6FF" stroke="#D6E5FA" stroke-width="2"/><text x="365.0" y="339.0" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="20" font-weight="700" fill="#071022" text-anchor="middle">Người dùng / bên thụ hưởng</text><rect x="150" y="390" width="430" height="62" rx="31.0" fill="#EDF6FF" stroke="#D6E5FA" stroke-width="2"/><text x="365.0" y="429.0" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="20" font-weight="700" fill="#071022" text-anchor="middle">Người mua kinh tế / ngân sách</text><rect x="150" y="480" width="430" height="62" rx="31.0" fill="#EDF6FF" stroke="#D6E5FA" stroke-width="2"/><text x="365.0" y="519.0" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="20" font-weight="700" fill="#071022" text-anchor="middle">Mua sắm / hợp đồng</text><rect x="850" y="300" width="430" height="62" rx="31.0" fill="#F7F5FF" stroke="#D6E5FA" stroke-width="2"/><text x="1065.0" y="339.0" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="20" font-weight="700" fill="#071022" text-anchor="middle">Hành động / thành thạo</text><rect x="850" y="390" width="430" height="62" rx="31.0" fill="#F7F5FF" stroke="#D6E5FA" stroke-width="2"/><text x="1065.0" y="429.0" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="20" font-weight="700" fill="#071022" text-anchor="middle">Chơi lại / giá trị</text><rect x="850" y="480" width="430" height="62" rx="31.0" fill="#F7F5FF" stroke="#D6E5FA" stroke-width="2"/><text x="1065.0" y="519.0" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="20" font-weight="700" fill="#071022" text-anchor="middle">Giá / phân phối</text></svg>