<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc" lang="vi" data-language="vi-VN" data-alt-text-vi="Tám kiểm tra prototype Music: hiểu cách chơi, hành động vui và ổn định, giá trị VR, chơi lại, gánh nặng nội dung, tín hiệu sẵn sàng chi trả, phân phối và kinh tế bản quyền."><title id="title">Lộ trình kiểm chứng prototype Music</title><desc id="desc">Tám kiểm tra prototype từ hiểu cách chơi và hành động nhập vai đến chơi lại, gánh nặng nội dung, tín hiệu sẵn sàng chi trả, phân phối và kinh tế bản quyền.</desc><metadata id="text-equivalent-vi">Tám kiểm tra prototype Music: hiểu cách chơi, hành động vui và ổn định, giá trị VR, chơi lại, gánh nặng nội dung, tín hiệu sẵn sàng chi trả, phân phối và kinh tế bản quyền.</metadata><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1238D4"/><stop offset="0.58" stop-color="#1378E5"/><stop offset="1" stop-color="#13B7ED"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity="0.10"/></filter></defs><rect width="1440" height="720" rx="32" fill="#FFFFFF"/><text x="80" y="70" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="35" font-weight="800" fill="#071022" text-anchor="start">Vòng học hỏi mẫu thử (prototype) Music</text><text x="80" y="108" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="17" font-weight="600" fill="#64748B" text-anchor="start">Bị khóa bởi mẫu thử; không hàm ý phê duyệt sản phẩm hoàn chỉnh</text><rect x="70" y="165" width="290" height="145" rx="28" fill="#EDF6FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="100" y="213" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="28" font-weight="700" fill="#071022" text-anchor="start">01</text><text x="100" y="249" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">Hiểu cách chơi trong 30–60 giây</text><rect x="410" y="165" width="290" height="145" rx="28" fill="#EDF6FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="440" y="213" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="28" font-weight="700" fill="#071022" text-anchor="start">02</text><text x="440" y="249" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">Hành động vui + ổn định</text><rect x="750" y="165" width="290" height="145" rx="28" fill="#EDF6FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="780" y="213" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="28" font-weight="700" fill="#071022" text-anchor="start">03</text><text x="780" y="249" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start">VR tạo giá trị so với màn hình phẳng</text><rect x="1090" y="165" width="290" height="145" rx="28" fill="#EDF6FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="1120" y="213" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="28" font-weight="700" fill="#071022" text-anchor="start">04</text><text x="1120" y="249" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">Tự nguyện chơi lại</text><rect x="70" y="385" width="290" height="145" rx="28" fill="#E9E8FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="100" y="433" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="28" font-weight="700" fill="#071022" text-anchor="start">05</text><text x="100" y="469" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start">Kiểm soát gánh nặng nội dung</text><rect x="410" y="385" width="290" height="145" rx="28" fill="#E9E8FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="440" y="433" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="28" font-weight="700" fill="#071022" text-anchor="start">06</text><text x="440" y="469" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start">Tín hiệu sẵn sàng chi trả</text><rect x="750" y="385" width="290" height="145" rx="28" fill="#E9E8FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="780" y="433" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="28" font-weight="700" fill="#071022" text-anchor="start">07</text><text x="780" y="469" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">Đường phân phối</text><rect x="1090" y="385" width="290" height="145" rx="28" fill="#E9E8FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="1120" y="433" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="28" font-weight="700" fill="#071022" text-anchor="start">08</text><text x="1120" y="469" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">Kinh tế bản quyền</text><rect x="455" y="560" width="530" height="70" rx="35.0" fill="#F7FBFF" stroke="#D6E5FA" stroke-width="2"/><text x="720.0" y="603.0" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="20" font-weight="700" fill="#071022" text-anchor="middle">Học → sửa → kiểm thử lại / dừng</text></svg>