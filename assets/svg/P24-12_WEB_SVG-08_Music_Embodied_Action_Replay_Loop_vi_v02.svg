<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc" lang="vi" data-language="vi-VN" data-alt-text-vi="Vòng Music từ đọc nhịp hoặc tín hiệu không gian, hành động cơ thể, nhận phản hồi điểm hoặc độ chính xác đến chơi lại để thành thạo; nội dung và bản quyền vẫn cần kiểm chứng."><title id="title">Vòng hành động và chơi lại Music</title><desc id="desc">Người chơi đọc nhịp hoặc tín hiệu không gian, hành động bằng cơ thể, nhận phản hồi điểm hoặc độ chính xác rồi chơi lại để thành thạo; nội dung và bản quyền vẫn là cổng kiểm chứng.</desc><metadata id="text-equivalent-vi">Vòng Music từ đọc nhịp hoặc tín hiệu không gian, hành động cơ thể, nhận phản hồi điểm hoặc độ chính xác đến chơi lại để thành thạo; nội dung và bản quyền vẫn cần kiểm chứng.</metadata><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1238D4"/><stop offset="0.58" stop-color="#1378E5"/><stop offset="1" stop-color="#13B7ED"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity="0.10"/></filter></defs><rect width="1440" height="720" rx="32" fill="#FFFFFF"/><text x="80" y="78" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="36" font-weight="800" fill="#071022" text-anchor="start">Vòng hành động / chơi lại Music</text><text x="80" y="112" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="18" font-weight="600" fill="#64748B" text-anchor="start">Ngữ pháp tương tác nguyên bản — không phải trò chơi hoàn thiện</text><rect x="130" y="240" width="250" height="115" rx="28" fill="#E9E8FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="160" y="288" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="20" font-weight="700" fill="#071022" text-anchor="start">Đọc nhịp / tín hiệu không gian</text><rect x="450" y="150" width="250" height="115" rx="28" fill="#E9E8FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="480" y="198" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="21" font-weight="700" fill="#071022" text-anchor="start">Chặn / đổi hướng / né</text><rect x="840" y="160" width="250" height="115" rx="28" fill="#E9E8FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="870" y="208" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="19" font-weight="700" fill="#071022" text-anchor="start">Phản hồi điểm / độ chính xác</text><rect x="1080" y="370" width="250" height="115" rx="28" fill="#E9E8FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="1110" y="418" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="20" font-weight="700" fill="#071022" text-anchor="start">Chơi lại để thành thạo</text><rect x="510" y="500" width="250" height="115" rx="28" fill="#E9E8FF" stroke="#D5E3F6" stroke-width="2" filter="url(#shadow)"/><text x="540" y="548" font-family="Arial, &quot;Noto Sans&quot;, sans-serif" font-size="22" font-weight="700" fill="#071022" text-anchor="start">Cổng nội dung + bản quyền</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#A7B8D8"/></marker></defs><line x1="255" y1="355" x2="575" y2="150" stroke="#A7B8D8" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#A7B8D8"/></marker></defs><line x1="575" y1="265" x2="965" y2="160" stroke="#A7B8D8" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#A7B8D8"/></marker></defs><line x1="965" y1="275" x2="1205" y2="370" stroke="#A7B8D8" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#A7B8D8"/></marker></defs><line x1="1205" y1="485" x2="635" y2="500" stroke="#A7B8D8" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#A7B8D8"/></marker></defs><line x1="635" y1="615" x2="255" y2="240" stroke="#A7B8D8" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"/></svg>